server {
    # Nginx listens on port 80 inside the frontend container.
    listen 80;

    # "_" means this config handles any hostname.
    server_name _;

    # Folder where the built Vite files are placed.
    root /usr/share/nginx/html;

    # Default file to serve for the app.
    index index.html;

    # Proxy API requests from the browser to the backend container.
    # This lets the frontend call /api/... instead of hard-coding localhost.
    location /api/ {
        # "backend" is the Compose service name, so Docker DNS resolves it automatically.
        proxy_pass http://backend:3000/api/;

        # Use HTTP/1.1 for proxy requests.
        proxy_http_version 1.1;

        # Pass useful request information to the backend.
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Serve the React single-page app.
    # If a direct route like /chat is opened, return index.html so React can render it.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
